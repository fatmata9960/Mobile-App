<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Distribution Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0078d4;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:20px auto;
}

.dashboard{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card h3{
    color:#444;
    margin-bottom:10px;
}

.card p{
    font-size:30px;
    font-weight:bold;
    color:green;
}

.form-section{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.form-section h2{
    margin-bottom:15px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0078d4;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.stock-box{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.stock-box input{
    margin-bottom:0;
}
</style>
</head>

<body>

<header>
    <h1>ITN Distribution Tracker</h1>
</header>

<div class="container">

    <div class="dashboard">
        <div class="card">
            <h3>Total Received</h3>
            <p id="received">0</p>
        </div>

        <div class="card">
            <h3>Total Distributed</h3>
            <p id="distributed">0</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balance">0</p>
        </div>
    </div>

    <div class="form-section">
        <h2>Stock Received</h2>

        <div class="stock-box">
            <input type="number" id="stockReceived" placeholder="Enter Quantity Received">
            <button onclick="addStock()">Add Stock</button>
        </div>
    </div>

    <div class="form-section">
        <h2>New Distribution</h2>

        <input type="date" id="date">

        <select id="district">
            <option value="">Select District</option>
            <option>Bo</option>
            <option>Kenema</option>
            <option>Bombali</option>
            <option>Port Loko</option>
            <option>Western Area Urban</option>
            <option>Western Area Rural</option>
        </select>

        <input type="text" id="point" placeholder="Distribution Point">

        <input type="number" id="quantity" placeholder="Quantity Distributed">

        <button onclick="saveDistribution()">Save Distribution</button>
    </div>

    <div class="form-section">
        <h2>Distribution Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>District</th>
                    <th>Distribution Point</th>
                    <th>Quantity</th>
                </tr>
            </thead>

            <tbody id="records">
            </tbody>
        </table>

    </div>

</div>

<script>

let totalReceived = 0;
let totalDistributed = 0;

function updateDashboard(){

    document.getElementById("received").textContent = totalReceived;

    document.getElementById("distributed").textContent =
        totalDistributed;

    document.getElementById("balance").textContent =
        totalReceived - totalDistributed;
}

function addStock(){

    let qty =
        parseInt(document.getElementById("stockReceived").value);

    if(isNaN(qty) || qty <= 0){
        alert("Enter a valid quantity");
        return;
    }

    totalReceived += qty;

    document.getElementById("stockReceived").value = "";

    updateDashboard();
}

function saveDistribution(){

    let date =
        document.getElementById("date").value;

    let district =
        document.getElementById("district").value;

    let point =
        document.getElementById("point").value;

    let quantity =
        parseInt(document.getElementById("quantity").value);

    if(date === "" || district === "" || point === "" || isNaN(quantity)){
        alert("Please complete all fields");
        return;
    }

    if(quantity > (totalReceived - totalDistributed)){
        alert("Not enough stock available");
        return;
    }

    totalDistributed += quantity;

    let row =
        `<tr>
            <td>${date}</td>
            <td>${district}</td>
            <td>${point}</td>
            <td>${quantity}</td>
        </tr>`;

    document.getElementById("records").innerHTML += row;

    updateDashboard();

    document.getElementById("date").value = "";
    document.getElementById("district").value = "";
    document.getElementById("point").value = "";
    document.getElementById("quantity").value = "";
}

updateDashboard();

</script>

</body>
</html>
